<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <style>
        h1 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            margin-bottom: 0;
        }
        
        h2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            margin-bottom: 0;
            margin-top: 50px;
        }
        div {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }
        a {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: medium;
            text-decoration: none;
            
            color: black;
            background-color: rgb(240, 240, 240);
            
            min-height: fit-content;
            min-width: fit-content;
            padding: 15px;
            
            border: 1px solid black;
            border-radius: 4%;
            margin-top: 20px;
            
            position: static;
            margin: 0;
        }
        a:hover {
            transition: 0.4s;
            background-color: rgb(230, 230, 230);
        }
    </style>
</head>
<body>
    <h1>API Endpoint</h1>
    <hr>
    
    <!-- Sección clientes -->
    <h2>Clientes</h2>
    <hr>
    <br>
    <a href="/clientes">Clientes</a>
    
    <!-- Sección pedidos -->
    <h2>Pedidos</h2>
    <hr>
    <br>
    <a href="/pedidos">Pedidos</a>
    <br>
    <div>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
